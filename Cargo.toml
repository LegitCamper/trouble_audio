[workspace]
resolver = "2"
members = [
  "trouble-audio",
  "examples/apps",
  "examples/linux",
  "examples/linux-serial",
  "examples/rp-pico-w",
  "examples/nRF54L15_Connect_Kit",
]

# Not crates.io, so it can't go through [patch.crates-io] - members opt in via
# `trouble-host = { workspace = true, features = [...] }`.
[workspace.dependencies]
# Not `main` (c21b1239) - that branch is missing the alloc_buf()/Controller::Buffer fix from
# `nrf54-bt-hci-alloc`, which is still at this commit. Overridden below to the local checkout,
# which has that fix plus the bt-hci 0.10 migration (see `[patch]`).
trouble-host = { git = "https://github.com/LegitCamper/trouble", rev = "679b3fd7a3d3dca1ad0ea890da0de737cecaef9e" }

[profile.release]
debug = 2

# Local checkouts of the user's own forks (see `../trouble`, `../nrf-sdc`), not yet pushed:
# `trouble-host` bumped to `bt-hci` 0.10 (see below - upstream published the CIS/CIG/ISO data
# path commands this crate needs, so there's no more need to patch `bt-hci` itself to a fork), and
# `nrf-sdc`/`nrf-mpsl` similarly updated plus adapted to the new HCI commands' shape.
[patch."https://github.com/LegitCamper/trouble"]
trouble-host = { path = "../trouble/host" }

[patch.crates-io]
