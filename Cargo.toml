[workspace]
resolver = "2"
members = [
  "trouble-audio",
  "examples/apps",
  "examples/linux",
  "examples/linux-serial",
  "examples/rp-pico-w",
  "examples/nRF54L15_Connect_Kit",
]

[workspace.dependencies]
trouble-host = { git = "https://github.com/LegitCamper/trouble", rev = "d30c550f4022c3dbf61a27c49b84873d51dc64fd" }

[profile.release]
debug = 2
lto = true
codegen-units = 1

[patch.crates-io]
# Required until the BIG handle width and LE BIG Create Sync fields are fixed in bt-hci.
bt-hci = { git = "https://github.com/LegitCamper/bt-hci", rev = "48337e506a15d7665f5d4caa4d4613388b2e7c64" }
# Keep command types and controllers on the same transport crate as the patched bt-hci.
bt-hci-transport = { git = "https://github.com/LegitCamper/bt-hci", rev = "48337e506a15d7665f5d4caa4d4613388b2e7c64" }
# Not embassy's true HEAD (6826068f) - its embassy-net/embassy-stm32-wpan manifests don't parse
# (upstream bug, commit 680b19296). This is HEAD's parent.
