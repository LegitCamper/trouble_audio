[workspace]
resolver = "2"
members = [
  "trouble-audio",
  "examples/apps",
  "examples/linux",
  "examples/linux-serial",
  "examples/rp-pico-w",
  "examples/nRF54L15_Connect_Kit",
]

[workspace.dependencies]
trouble-host = { git = "https://github.com/LegitCamper/trouble", rev = "1f154caf2c4e1fb46bfcec0677c8545457c9b85b" }

[profile.release]
debug = 2
lto = true
codegen-units = 1

[patch.crates-io]
# bt-hci 0.11. Two fork patches are still not upstream: dropping `ExternalController`'s
# `C::Return: FixedSizeValue` bound (it excluded the variable-length
# `LE Set CIG Parameters` return, so every host-side CIG setup over an HCI socket or UART failed
# to compile), and re-adding `CisConfigTest::nse`, which upstream dropped even though NSE[i] is
# mandatory in `LE Set CIG Parameters Test` (Core 6 Vol 4 Part E §7.8.98).
bt-hci = { git = "https://github.com/LegitCamper/bt-hci", rev = "a3b9b9785ef6e8269db31e1431f7d0710a6265cc" }
# Keep command types and controllers on the same transport crate as the patched bt-hci.
bt-hci-transport = { git = "https://github.com/LegitCamper/bt-hci", rev = "a3b9b9785ef6e8269db31e1431f7d0710a6265cc" }
# This fork keeps the previously selected Embassy generation while moving CYW43 to bt-hci 0.11
# and adding the resident-controller adapter. One git source avoids duplicate private Embassy
# crates with incompatible types.
embassy-embedded-hal = { git = "https://github.com/LegitCamper/embassy.git", rev = "ee2eecf8362a33cb4e9f0eb2e57f8e8d56ae893c" }
