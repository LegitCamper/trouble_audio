embassy-hal-internal = { git = "https://github.com/LegitCamper/embassy.git", rev = "ee2eecf8362a33cb4e9f0eb2e57f8e8d56ae893c" }
embassy-net-driver-channel = { git = "https://github.com/LegitCamper/embassy.git", rev = "ee2eecf8362a33cb4e9f0eb2e57f8e8d56ae893c" }
embassy-nrf = { git = "https://github.com/LegitCamper/embassy.git", rev = "ee2eecf8362a33cb4e9f0eb2e57f8e8d56ae893c" }
