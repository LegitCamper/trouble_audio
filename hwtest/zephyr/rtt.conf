CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=1
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=1
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_BT_BAP_UNICAST_CLIENT_LOG_LEVEL_INF=y

# Zephyr's bap_unicast_client sample omits this, so the controller's ISO Tx buffer
# stays at the Kconfig default 9 bytes and LL_CIS_OCTETS_TX_MAX becomes 9 - 8 = 1.
# The CIG is then built with Max_PDU 1 / BN 4, which the peripheral rejects with
# 0x1e (Unsupported LL Parameter Value). 247 SDU + 8 byte HCI ISO header.
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=255

# One ISOAL source/sink per CIS. The sample streams to two sink ASEs, but the
# defaults are 1, so the second `LE Setup ISO Data Path` returns 0x0c
# (Command Disallowed) and that stream never reaches the connected state.
CONFIG_BT_CTLR_ISOAL_SOURCES=2
CONFIG_BT_CTLR_ISOAL_SINKS=2

# bap_unicast_server's extended advertising payload is 39 bytes (flags + ASCS UUID +
# Audio Announcement + 20-char name), but the Zephyr controller defaults to a 31-byte
# advertising data buffer, so bt_le_ext_adv_set_data() fails with -33 and the sample
# never advertises.
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
