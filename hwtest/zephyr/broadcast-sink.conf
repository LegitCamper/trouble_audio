# The sample defaults to scan offload, so it advertises and waits for a Broadcast
# Assistant ("Waiting for Broadcast Assistant") instead of scanning for our source.
# We test the standalone sink path; BASS orchestration is a separate scenario.
CONFIG_SCAN_OFFLOAD=n

# The encoded BASE is 46 bytes. Zephyr's controller defaults scan reports to 31 bytes and silently
# drops larger periodic advertising reports, leaving the sample stuck at sem_base_received.
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=191

# The sample syncs both BISes in one BIG. The default permits two streams globally but only one per
# BIG, so the second LE Setup ISO Data Path returns 0x02 (Unknown Connection Identifier).
CONFIG_BT_CTLR_SYNC_ISO_STREAM_MAX=2
