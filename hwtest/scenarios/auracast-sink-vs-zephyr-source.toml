# Zephyr advertises and streams a broadcast; our sink discovers the announcement, parses the
# BASE, synchronizes the BIG, and decodes BIS payloads.

description = "Zephyr BAP broadcast source -> trouble-audio broadcast sink"
timeout = 120

[boards.A]
firmware = "trouble-audio"
bin = "broadcast_sink"
require = [
    "Running Auracast broadcast sink example",
    "broadcast discovered",
    "decoded BIS",
]
forbid = [
    "extended scan failed",
    "periodic sync command failed",
    "memory allocation of",
    "panicked",
]

[boards.B]
firmware = "zephyr"
sample = "samples/bluetooth/bap_broadcast_source"
capture = "rtt"
extra_conf = [
    "/var/home/sawyer/projects/trouble_audio/hwtest/zephyr/rtt.conf",
    "/var/home/sawyer/projects/trouble_audio/hwtest/zephyr/broadcast-source.conf",
]
require = [
    "Creating broadcast source",
    "Starting broadcast source",
    "Broadcast source started",
    "Sent [1-9][0-9]* total ISO packets",
]
forbid = [
    "Unable to",
    # probe-rs RTT host noise, not firmware.
    "Failed to (?!create readline)",
    "Could not allocate buffer",
    "ASSERTION FAIL",
]
