[package]
name = "trouble_audio"
version = "0.1.0"
edition = "2021"

[features]
default = []
defmt = ["dep:defmt", "defmt/alloc", "trouble-host/defmt", "heapless/defmt"]
log = ["dep:log", "embassy-time/log", "trouble-host/log"]
# Use Nordic's documented `LE Set CIG Parameters Test` workaround for CIG setup instead of the
# plain, spec-standard `LE Set CIG Parameters` - needed only for Nordic's SoftDevice Controller
# (at least on the nRF54L, it rejects the plain command). Leave this off for any other controller:
# applying the workaround unconditionally would be a footgun, and it drops per-CIS retransmission
# control that the standard command has (see `cig.rs`'s module docs).
nrf-sdc = []

[dependencies]
embassy-sync = "0.8"
embassy-futures = "0.1.1"
embassy-time = "0.5.1"
bt-hci = { version = "0.10", features = ["uuid"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
trouble-host = { workspace = true, features = [
  "derive",
  "gatt",
  "peripheral",
  "central",
  "scan",
  "security",
  "iso",
  "serde",
  "default-packet-pool",
] }

lc3-codec = "0.2.0"

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4", optional = true }
static_cell = "2.1.0"
heapless = "0.9"
bitflags = "2.8.0"
