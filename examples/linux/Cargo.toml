[package]
name = "linux-examples"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11"
log = "0.4"
embedded-io = { version = "0.7", features = ["std"] }
embassy-sync = { version = "0.8", features = ["log"] }
embassy-time = { version = "0.5.1", features = [
  "log",
  "std",
  "generic-queue-8",
] }
critical-section = { version = "1.1", features = ["std"] }
tokio = { version = "1", features = ["full"] }
bt-hci = { version = "0.9", default-features = false, features = [
  "log",
  "uuid",
] }
bt-hci-linux = { path = "../../../trouble/bt-hci-linux" }

trouble-audio-example-apps = { version = "0.1.0", path = "../apps", features = [
  "log",
] }
trouble_audio = { path = "../../trouble-audio", default-features = false, features = [
  "log",
] }
pipewire = "0.10.0"
serde = "1.0"
serde_json = "1.0"

[patch.crates-io]
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
