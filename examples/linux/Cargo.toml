[package]
name = "linux-examples"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11"
log = "0.4"
embedded-io = { version = "0.7", features = ["std"] }
embassy-sync = { version = "0.8", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log", "std", "generic-queue-8"] }
critical-section = { version = "1.1", features = ["std"] }
tokio = { version = "1", features = ["full"] }
bt-hci = { version = "0.9", default-features = false, features = ["log", "uuid"] }
bt-hci-linux = { git = "https://github.com/embassy-rs/trouble.git", rev = "07bf6c06e974be4b53681e11a4d53c0404f13141" }

trouble-audio-example-apps = { version = "0.1.0", path = "../apps", features = [
  "log",
] }
