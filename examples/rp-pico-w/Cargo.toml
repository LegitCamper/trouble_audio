[package]
name = "trouble-audio-examples"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
embassy-executor = { version = "0.10.0", default-features = false, features = [
  "platform-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "log",
] }
embassy-time = { version = "0.5.1", default-features = false, features = [
  "log",
] }
embassy-rp = { version = "0.10.0", features = [
  "log",
  "unstable-pac",
  "time-driver",
  "critical-section-impl",
  "rp2040",
] }
embassy-futures = "0.1.2"
embassy-sync = { version = "0.8", features = ["log"] }

futures = { version = "0.3", default-features = false, features = [
  "async-await",
] }
bt-hci = { version = "0.10", default-features = false, features = [
  "log",
  "uuid",
] }
cyw43 = { version = "0.7.0", features = ["log", "firmware-logs", "bluetooth"] }
# No "log" alternative for cyw43-pio (only an optional "defmt" feature it doesn't need for this
# example to work) - leaving it disabled just means cyw43-pio's own handful of debug prints don't
# show up; unrelated to this crate's own logging.
cyw43-pio = { version = "0.10.0" }

# USB-serial logging via `embassy-usb-logger` (implements `log::Log`) instead of defmt/RTT, so
# nothing here needs a debug probe - connect with any serial terminal (e.g.
# `screen /dev/ttyACM0 115200`).
log = "0.4"
embassy-usb-logger = "0.6.0"

cortex-m = { version = "0.7.6" }
cortex-m-rt = "0.7.0"
# No print feature: printing a panic message would need defmt (`print-defmt`) or RTT
# (`print-rtt`), both back on a probe/defmt - a panic still safely halts the MCU, it just won't
# show up over the USB log.
panic-probe = { version = "1.0.0" }
static_cell = "2"
portable-atomic = { version = "1.5", features = ["critical-section"] }
embedded-alloc = "0.6.0"

trouble-audio-example-apps = { version = "0.1.0", path = "../apps", features = [
  "log",
] }
trouble_audio = { path = "../../trouble-audio", default-features = false, features = [
  "log",
] }
trouble-host = { workspace = true, features = ["derive", "gatt", "peripheral", "scan", "security", "default-packet-pool"] }
# For `hci_bridge`: cyw43 still speaks bt-hci 0.9's typed Transport, ExternalController needs
# bt-hci-transport 0.1's byte-level one.
bt-hci09 = { package = "bt-hci", version = "0.9" }
bt-hci-transport = "0.1"
embedded-io = "0.7"
embedded-io-async = "0.7"

[build-dependencies]
reqwest = { version = "0.12.9", features = ["blocking"] }

[features]
skip-cyw43-firmware = []
