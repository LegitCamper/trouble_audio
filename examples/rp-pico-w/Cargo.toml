[package]
name = "trouble-audio-examples"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
embassy-executor = { version = "0.10.0", default-features = false, features = [
  "platform-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "defmt",
] }
embassy-time = { version = "0.5.1", default-features = false, features = [
  "defmt",
  "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.10.0", features = [
  "defmt",
  "unstable-pac",
  "time-driver",
  "critical-section-impl",
  "rp2040",
] }
embassy-futures = "0.1.2"
embassy-sync = { version = "0.8", features = ["defmt"] }

futures = { version = "0.3", default-features = false, features = [
  "async-await",
] }
bt-hci = { version = "0.9", default-features = false, features = [
  "defmt",
  "uuid",
] }
trouble-host = { path = "../../../trouble/host" }
cyw43 = { version = "0.7.0", features = [
  "defmt",
  "firmware-logs",
  "bluetooth",
] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6" }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2"
portable-atomic = { version = "1.5", features = ["critical-section"] }
embedded-alloc = "0.6.0"

trouble-audio-example-apps = { version = "0.1.0", path = "../apps", features = [
  "defmt",
] }
trouble_audio = { path = "../../trouble-audio", default-features = false, features = [
  "defmt",
] }

[build-dependencies]
reqwest = { version = "0.12.9", features = ["blocking"] }

[features]
skip-cyw43-firmware = []

[profile.release]
debug = 2

# cyw43 only picked up bt-hci 0.9 support on the embassy monorepo's main branch (not yet in a
# published crates.io release as of this writing), and embassy crates need to come from a single
# consistent build (embassy-time in particular is a `links` crate - Cargo errors if two different
# sources of it end up in the same dependency graph, which happens as soon as anything else in the
# graph, like trouble-host, pulls in the crates.io release). So every embassy-family crate anyone
# in this graph might reference is patched to the same commit.
[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
cyw43 = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy.git", rev = "b87c67be691bcb9aa0e1f3813d90d9eb04dd1751" }
